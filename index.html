<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
  /* Poore page ka font aur background thik karne ke liye */
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f9fc; /* Light refreshing blue background */
    color: #333333;
    padding: 40px;
    max-width: 800px;
    margin: 0 auto; /* Center alignment */
  }

  /* SANITRO Title */
  h1 {
    color: #0056b3; /* Professional Dark Blue */
    font-size: 42px;
    letter-spacing: 2px;
    margin-bottom: 5px;
  }

  /* Subheading */
  h2 {
    color: #2c3e50;
    font-size: 24px;
    margin-top: 0;
  }

  /* Paragraph Text */
  p {
    font-size: 16px;
    line-height: 1.6;
    color: #555555;
    margin-bottom: 30px;
  }

  /* Dropdown Select Box */
  select {
    padding: 8px 12px;
    border-radius: 5px;
    border: 1px solid #cccccc;
    font-size: 14px;
    margin-bottom: 40px;
    display: block;
  }

  /* REPORT OVERFLOW Button */
  button {
    background-color: #e74c3c; /* Red Emergency Alert Color */
    color: white;
    border: none;
    padding: 15px 30px;
    font-size: 16px;
    font-weight: bold;
    border-radius: 8px;
    cursor: pointer;
    letter-spacing: 1px;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    transition: 0.3s;
  }

  /* Button par mouse le jaane par change */
  button:hover {
    background-color: #c0392b;
    transform: translateY(-2px);
  }
</style>

</head>
<body>
  
  <h1>SANITRO</h1>
  <P>
    <H2>Smart Sanitation. Instant Relief</H2>
    <H3>Connecting local residents with verified sanitation workers during monsoon emergencies. Report sewage overflows instantly and get hyper-local community help without any delay</H3>
  </P>
  <!-- Language Selection Dropdown -->
<label for="language-select">Choose Language / भाषा चुनें:</label>
<select id="language-select">
  <option value="en">English</option>
  <option value="hi">हिंदी (Hindi)</option>
</select>
<BR/>
<BR/>
<BUTTON>REPORT OVERFLOW</BUTTON>
  <script>
  // Saare web page fragments ko JavaScript text links se jodne ke liye
  const langSelect = document.getElementById('language-select');
  
  // Element selections (Inhe check kar lena ki aapke HTML tags me ye content match kare)
  const mainHeading = document.querySelector('h2'); // Smart Sanitation. Instant Relief.
  const description = document.querySelector('p');  // Connecting local residents...
  const actionBtn = document.querySelector('button'); // REPORT OVERFLOW

  // Language content changes
  langSelect.addEventListener('change', function() {
    if (this.value === 'hi') {
      mainHeading.textContent = "स्मार्ट सफाई। तुरंत राहत।";
      description.textContent = "मानसून के समय सीवरेज ओवरफ्लो और ब्लॉकेज की समस्या के समाधान के लिए स्थानीय निवासियों को सीधे सत्यापित सफाई कर्मचारियों से जोड़ना। बिना किसी देरी के तुरंत शिकायत दर्ज करें।";
      actionBtn.textContent = "शिकायत दर्ज करें";
    } else {
      mainHeading.textContent = "Smart Sanitation. Instant Relief.";
      description.textContent = "Connecting local residents with verified sanitation workers during monsoon emergencies. Report sewage overflows instantly and get hyper-local community help without any delay";
      actionBtn.textContent = "REPORT OVERFLOW";
    }
  });
</script>

</body>
</html>
