<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANITRO - Smart Sanitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="logo">SANITRO</h1>
        
        <h2 class="tagline">Smart Sanitation. Instant Relief</h2>
        
        <p class="description">
            Connecting local residents with verified sanitation workers during monsoon emergencies. 
            Report sewage overflows instantly and get hyper-local help without any delay.
        </p>

        <!-- Language Selection Dropdown -->
        <div class="language-box">
            <label for="language-select">Choose Language / भाषा चुनें:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
            </select>
        </div>

        <br>

        <button class="report-btn">REPORT OVERFLOW</button>
        <!-- Emergency Report Popup Form -->
<div id="reportModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>Report Sewage Emergency</h2>
        <form id="overflowForm">
            <label>Your Name / naam:</label>
            <input type="text" placeholder="Enter your name" required>

            <label>Location / Pata:</label>

            <input type="text" placeholder="Area / Street / Landmark" required>

            <label>Severity Level / Kitni dikkat h:</label>

            <select>
                <option value="low">Low (Minor leakage)</option>
                <option value="medium">Medium (Road blocked)</option>
                <option value="high">Critical (Overflow entering homes)</option>
            </select>

            <button type="submit" class="submit-btn">Submit Emergency Report</button>
        </form>
    </div>
</div>
    </div>

  
<script src="script.js"></script>
</body>
</html>
