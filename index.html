<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SANITRO - Smart Sanitation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1 class="logo">SANITRO</h1>
        
        <h2 class="tagline">Smart Sanitation. Instant Relief</h2>
        
        <p class="description">
            Connecting local residents with verified sanitation workers during monsoon emergencies. 
            Report sewage overflows instantly and get hyper-local help without any delay.
        </p>

        <!-- Language Selection Dropdown -->
        <div class="language-box">
            <label for="language-select">Choose Language / भाषा चुनें:</label>
            <select id="language-select">
                <option value="en">English</option>
                <option value="hi">हिंदी (Hindi)</option>
            </select>
        </div>

        <br>

        <button class="report-btn">REPORT OVERFLOW</button>
        <!-- Emergency Report Popup Form -->
<!-- Emergency Report Popup Form -->
<div id="reportModal" class="modal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2>सीवरेज आपातकालीन शिकायत दर्ज करें</h2>
        <form id="overflowForm">
            <label>आपका नाम:</label>
            <input type="text" placeholder="अपना नाम दर्ज करें" required>

            <label>स्थान / पता:</label>
            <input type="text" placeholder="क्षेत्र / गली / निकटतम लैंडमार्क" required>

            <label>समस्या का स्तर:</label>
            <select>
                <option value="low">कम (हल्का रिसाव)</option>
                <option value="medium">मध्यम (रास्ता बंद)</option>
                <option value="high">गंभीर (घरों में पानी घुस रहा है)</option>
            </select>

            <button type="submit" class="submit-btn">आपातकालीन शिकायत भेजें</button>
        </form>
    </div>
</div>

  
<script src="script.js"></script>
</body>
</html>
